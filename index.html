<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК Астаны — Новое строительство</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%;
                     font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
                     color: #222; }

        #app { display: flex; height: 100vh; overflow: hidden; }

        /* ---------- Левая панель ---------- */
        #sidebar { width: 400px; min-width: 320px; max-width: 45vw;
                   display: flex; flex-direction: column;
                   border-right: 1px solid #e3e3e3; background: #fafafa; }
        #sidebar header { padding: 14px 16px 10px; background: #fff;
                          border-bottom: 1px solid #e3e3e3; }
        #sidebar header h1 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
        #sidebar header .meta { font-size: 12px; color: #777; }
        #search { margin-top: 10px; width: 100%; padding: 8px 12px;
                  border: 1px solid #ccc; border-radius: 6px; font-size: 13px; outline: none; }
        #search:focus { border-color: #2e9e44; }
        #list { flex: 1; overflow-y: auto; padding: 8px 10px; }

        .card { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px;
                padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
                transition: box-shadow .15s, border-color .15s;
                animation: cardIn .25s ease; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(-4px); }
                            to   { opacity: 1; transform: translateY(0); } }
        .card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); border-color: #c8c8c8; }
        .card.active { border-color: #2e9e44; box-shadow: 0 0 0 2px rgba(46,158,68,.15); }
        .card .title { font-size: 13px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; }
        .card .row { font-size: 12px; color: #555; margin-top: 2px; line-height: 1.4; }
        .card .code { font-size: 11px; color: #999; margin-top: 6px; }
        .card .btn-2gis { display: inline-block; margin-top: 8px; padding: 4px 8px;
                          background: #00b956; color: #fff; border-radius: 4px;
                          text-decoration: none; font-size: 11px; font-weight: 600; }
        .card .btn-2gis:hover { background: #009a46; }

        #empty { display: none; padding: 24px 16px; text-align: center;
                 font-size: 13px; color: #999; }

        /* ---------- Карта ---------- */
        #map-wrap { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* ---------- Индикатор загрузки ---------- */
        #loader { position: fixed; inset: 0; display: flex; flex-direction: column;
                  align-items: center; justify-content: center;
                  background: rgba(255, 255, 255, 0.95); z-index: 10000;
                  transition: opacity 0.3s ease; }
        #loader.hidden { opacity: 0; pointer-events: none; }
        #loader .spinner { width: 56px; height: 56px; border: 5px solid #e3e3e3;
                           border-top-color: #2e9e44; border-radius: 50%;
                           animation: spin 0.9s linear infinite; }
        #loader .title { margin-top: 18px; font-size: 18px; font-weight: 600; }
        #loader .subtitle { margin-top: 8px; font-size: 13px; color: #666;
                            max-width: 480px; text-align: center; }
        #loader .progress-wrap { margin-top: 16px; width: 320px; height: 6px;
                                 background: #e3e3e3; border-radius: 3px; overflow: hidden; }
        #loader .progress-bar { width: 0%; height: 100%; background: #2e9e44;
                                transition: width .25s ease; }
        #loader .progress-text { margin-top: 10px; font-size: 13px; color: #555; }
        #loader.error .spinner { display: none; }
        #loader.error .progress-wrap, #loader.error .progress-text { display: none; }
        #loader.error .title { color: #d63b3b; }
        #loader .error-msg { display: none; margin-top: 10px; max-width: 460px;
                             text-align: center; font-size: 13px; color: #666; }
        #loader.error .error-msg { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 720px) {
            #app { flex-direction: column; }
            #sidebar { width: 100%; max-width: 100%; height: 45vh; border-right: none;
                       border-bottom: 1px solid #e3e3e3; }
            #map-wrap { height: 55vh; }
        }
    </style>
</head>
<body>

    <div id="app">
        <aside id="sidebar">
            <header>
                <h1>Новое строительство — Астана</h1>
                <div class="meta">
                    Показано <span id="cnt">0</span> из <span id="cnt-total">0</span>
                </div>
                <input id="search" type="search" placeholder="Поиск по названию, адресу, заказчику…">
            </header>
            <div id="list"></div>
            <div id="empty">Ничего не найдено</div>
        </aside>

        <main id="map-wrap"><div id="map"></div></main>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="title">Загружаем ЖК…</div>
        <div class="subtitle" id="loader-subtitle">Подключаемся к серверу…</div>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-text" id="progress-text">0 / 0</div>
        <div class="error-msg" id="loader-error"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script>
        // ============================================================
        // 0. Loader
        // ============================================================
        const loader        = document.getElementById('loader');
        const loaderTitle   = loader.querySelector('.title');
        const loaderSub     = document.getElementById('loader-subtitle');
        const progressBar   = document.getElementById('progress-bar');
        const progressText  = document.getElementById('progress-text');
        const loaderError   = document.getElementById('loader-error');

        function hideLoader() { loader.classList.add('hidden'); }
        function failLoader(msg) {
            loader.classList.add('error');
            loaderTitle.textContent = 'Ошибка загрузки';
            loaderSub.textContent = '';
            loaderError.textContent = msg || '';
        }
        function updateProgress(current, total, subtitle) {
            const pct = total > 0 ? (current / total) * 100 : 0;
            progressBar.style.width = pct.toFixed(1) + '%';
            progressText.textContent = `${current} / ${total}`;
            if (subtitle) loaderSub.textContent = subtitle;
        }

        // ============================================================
        // 1. Карта
        // ============================================================
        const map = L.map('map', {
            updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 2
        }).setView([51.128, 71.430], 11);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            referrerPolicy: 'strict-origin-when-cross-origin',
            crossOrigin: true
        }).addTo(map);

        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            iconSize: [25,41], iconAnchor: [12,41],
            popupAnchor: [1,-34], shadowSize: [41,41]
        });

        // ============================================================
        // 2. Данные
        // ============================================================
        const zhkList    = [];               // все ЖК
        const markersById = new Map();       // id → { marker, zhk }
        const cardsById   = new Map();       // id → DOM-элемент

        const listEl     = document.getElementById('list');
        const emptyEl    = document.getElementById('empty');
        const cntEl      = document.getElementById('cnt');
        const cntTotalEl = document.getElementById('cnt-total');
        const searchEl   = document.getElementById('search');

        // ============================================================
        // 3. Хелперы
        // ============================================================
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, ch => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[ch]));
        }
        function route2gisUrl(zhk) {
            return `https://2gis.ru/directions/points/%7C${zhk.lon},${zhk.lat}`;
        }
        function popupHtml(zhk) {
            return `
                <div class="zhk-popup">
                    <b>${escapeHtml(zhk.name) || '—'}</b>
                    ${zhk.address  ? `<div class="row">📍 ${escapeHtml(zhk.address)}</div>` : ''}
                    ${zhk.customer ? `<div class="row">🏗 ${escapeHtml(zhk.customer)}</div>` : ''}
                    ${zhk.designer ? `<div class="row">✏️ ${escapeHtml(zhk.designer)}</div>` : ''}
                    ${zhk.code     ? `<div class="row">🔖 ${escapeHtml(zhk.code)}</div>` : ''}
                    <div class="badge">Новое строительство</div>
                    <div><a class="btn-2gis" target="_blank" href="${route2gisUrl(zhk)}">🚗 Маршрут в 2ГИС</a></div>
                </div>`;
        }
        function cardHtml(zhk) {
            const route = route2gisUrl(zhk);
            return `
                <div class="title">${escapeHtml(zhk.name) || '—'}</div>
                ${zhk.address  ? `<div class="row">📍 ${escapeHtml(zhk.address)}</div>` : ''}
                ${zhk.customer ? `<div class="row">🏗 ${escapeHtml(zhk.customer)}</div>` : ''}
                ${zhk.designer ? `<div class="row">✏️ ${escapeHtml(zhk.designer)}</div>` : ''}
                ${zhk.code     ? `<div class="code">${escapeHtml(zhk.code)}</div>` : ''}
                <a class="btn-2gis" target="_blank"
                   href="${route}"
                   onclick="event.stopPropagation()">🚗 2ГИС</a>`;
        }

        // ============================================================
        // 4. Связка карта ↔ список
        // ============================================================
        let activeId = null;
        function setActiveCard(id) {
            if (activeId && cardsById.has(activeId)) {
                cardsById.get(activeId).classList.remove('active');
            }
            activeId = id;
            if (id && cardsById.has(id)) {
                const card = cardsById.get(id);
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        function focusOnZhk(id) {
            const entry = markersById.get(id);
            if (!entry) return;
            const { marker } = entry;
            map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
            marker.openPopup();
            setActiveCard(id);
        }

        // ============================================================
        // 5. Добавление одного ЖК на карту и в список
        // ============================================================
        function addZhkToUI(zhk) {
            // Маркер
            const marker = L.marker([zhk.lat, zhk.lon], { icon: greenIcon });
            marker.bindPopup(popupHtml(zhk));
            marker.on('click', () => {
                setActiveCard(zhk.id);
                marker.openPopup();
            });
            marker.addTo(map);
            markersById.set(zhk.id, { marker, zhk });

            // Карточка
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = zhk.id;
            card.innerHTML = cardHtml(zhk);
            card.addEventListener('click', () => focusOnZhk(zhk.id));

            // Вставляем в начало списка, чтобы свежее было видно
            listEl.appendChild(card);
            cardsById.set(zhk.id, card);

            // Обновляем счётчик
            cntEl.textContent = zhkList.length + 1;

            // Карта расширяется под новые точки (плавно)
            // Делаем это только для первых 3-х, чтобы не дёргаться
            if (zhkList.length < 3) {
                const bounds = [];
                markersById.forEach(({ marker }) => bounds.push(marker.getLatLng()));
                if (bounds.length >= 2) {
                    map.fitBounds(L.latLngBounds(bounds), { padding: [30, 30], animate: true });
                } else {
                    map.setView(bounds[0], 13, { animate: true });
                }
            }
        }

        // ============================================================
        // 6. Поиск
        // ============================================================
        function applyFilter() {
            const q = searchEl.value.trim().toLowerCase();
            let visibleCount = 0;

            cardsById.forEach((card, id) => {
                const zhk = zhkList.find(z => z.id === id);
                if (!zhk) return;

                const match = !q ||
                    (zhk.name || '').toLowerCase().includes(q) ||
                    (zhk.address || '').toLowerCase().includes(q) ||
                    (zhk.customer || '').toLowerCase().includes(q) ||
                    (zhk.designer || '').toLowerCase().includes(q) ||
                    (zhk.code || '').toLowerCase().includes(q);

                card.style.display = match ? '' : 'none';
                const entry = markersById.get(id);
                if (entry) {
                    if (match) {
                        if (!map.hasLayer(entry.marker)) entry.marker.addTo(map);
                        visibleCount++;
                    } else {
                        if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
                    }
                }
            });

            emptyEl.style.display = visibleCount === 0 ? 'block' : 'none';
            cntEl.textContent = visibleCount;
        }
        searchEl.addEventListener('input', applyFilter);

        // ============================================================
        // 7. SSE-стриминг
        // ============================================================
        const es = new EventSource('/api/zhk/stream');
        let total = 0;

        es.addEventListener('meta', e => {
            const data = JSON.parse(e.data);
            total = data.total;
            cntTotalEl.textContent = total;
            updateProgress(0, total, `Найдено ${total} объектов. Начинаем геокодирование…`);
            // Скрываем оверлей, как только пришли метаданные —
            // список и карта уже будут наполняться постепенно
            hideLoader();
        });

        es.addEventListener('progress', e => {
            const data = JSON.parse(e.data);
            updateProgress(data.index, data.total, `Геокодируем: ${data.address}…`);
        });

        es.addEventListener('zhk', e => {
            const zhk = JSON.parse(e.data);
            zhkList.push(zhk);
            addZhkToUI(zhk);
            updateProgress(zhkList.length, total, null);
        });

        es.addEventListener('skip', e => {
            // Один адрес не найден — просто двигаем прогресс
            const data = JSON.parse(e.data);
            updateProgress(data.index, data.total, null);
        });

        es.addEventListener('done', e => {
            es.close();
            applyFilter();
            console.log('SSE завершён:', e.data);
        });

        es.addEventListener('error', e => {
            // SSE-ошибка: либо сервер прислал error-событие,
            // либо соединение оборвалось. Пытаемся закрыть красиво.
            if (e.data) {
                try {
                    const data = JSON.parse(e.data);
                    failLoader(data.message || 'Ошибка сервера');
                } catch { failLoader('Ошибка сервера'); }
            } else {
                failLoader('Соединение с сервером потеряно');
            }
            es.close();
        });

        map.on('click', e => console.log('Клик:', e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6)));
    </script>
</body>
</html>
