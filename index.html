<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК Астаны — Новое строительство</title>
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
    <style>
        /* ============================================================
           БАЗА
           ============================================================ */
        :root {
            --bg:        #fafbfc;
            --surface:   #ffffff;
            --border:    #eef0f2;
            --border-2:  #e3e6e9;
            --text:      #1f2328;
            --text-soft: #656d76;
            --text-mute: #8c959f;
            --accent:    #16a34a;   /* зелёный */
            --accent-bg: #eaf7ee;
            --shadow-sm: 0 1px 2px rgba(27,31,36,.04);
            --shadow-md: 0 4px 14px rgba(27,31,36,.08);
            --radius:    10px;
            /* Отступ прокручиваемого списка. Липкие шапки прилипают к
               верхнему краю #list, а position:sticky в Chrome считает
               смещение от края контента, то есть на величину этого
               отступа ниже. Чтобы шапка встала вровень с рамкой
               панели, вычитаем его; держим в одной переменной, иначе
               значения разъедутся при правке отступов. */
            --list-pad:  12px;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            line-height: 1.45;
        }

        #app { display: flex; height: 100vh; overflow: hidden; }

        /* ============================================================
           САЙДБАР
           ============================================================ */
        #sidebar {
            width: 400px;
            min-width: 320px;
            max-width: 46vw;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-right: 1px solid var(--border);
        }

        #sidebar header {
            padding: 20px 20px 14px;
            border-bottom: 1px solid var(--border);
        }
        #sidebar h1 {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -.01em;
        }
        #sidebar .meta {
            font-size: 12.5px;
            color: var(--text-mute);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #sidebar .meta .pill {
            display: inline-block;
            padding: 1px 8px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: 600;
        }

        /* Поиск */
        .search-wrap { position: relative; margin-top: 14px; }
        .search-wrap svg {
            position: absolute; left: 11px; top: 50%;
            transform: translateY(-50%);
            width: 15px; height: 15px;
            color: var(--text-mute);
            pointer-events: none;
        }
        #search {
            width: 100%;
            padding: 9px 12px 9px 32px;
            border: 1px solid var(--border-2);
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            color: var(--text);
        }
        #search::placeholder { color: var(--text-mute); }
        #search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(22,163,74,.12);
        }

        #list {
            flex: 1;
            overflow-y: auto;
            padding: var(--list-pad) var(--list-pad) 20px;
        }

        /* Скроллбар потоньше */
        #list::-webkit-scrollbar { width: 8px; }
        #list::-webkit-scrollbar-thumb {
            background: #dde0e3; border-radius: 4px;
            border: 2px solid var(--surface);
        }
        #list::-webkit-scrollbar-thumb:hover { background: #c7cbd0; }
        #list::-webkit-scrollbar-track { background: transparent; }

        /* ============================================================
           КАРТОЧКА
           ============================================================ */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s, transform .1s;
            animation: cardIn .25s ease both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(-3px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .card:hover {
            border-color: var(--border-2);
            box-shadow: var(--shadow-md);
        }
        .card.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(22,163,74,.10);
        }

        .card .title {
            font-size: 13.5px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 10px;
            letter-spacing: -.005em;
        }

        /* ---------- Облегчение карточки ----------
           Названия из реестра бывают на 5–6 строк, и одна такая карточка
           занимала пол-экрана. Ограничиваем число строк: полный текст
           остаётся в попапе, там ограничения нет. */
        .card .title,
        .card .copy-row .value {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .title { -webkit-line-clamp: 3; }
        .card .copy-row .value { -webkit-line-clamp: 2; }

        /* Адрес уже написан строкой выше — в заголовке группы */
        .card.in-group .copy-row.addr { display: none; }

        /* ---------- Группа объектов на одном адресе ---------- */
        .group {
            margin-bottom: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            /* Без overflow:hidden — он делает блок контейнером
               прокрутки, и position:sticky внутри перестаёт работать.
               Скруглённые углы задаём шапке и последней карточке. */
        }
        .group-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            cursor: pointer;
            background: #f6f7f9;
            border-bottom: 1px solid var(--border);
            user-select: none;
            /* Шапка липнет к верху списка: на «Нәжімеденова» с
               12 объектами иначе адрес уезжает за экран и видно
               только сами карточки. */
            position: sticky;
            top: calc(-1 * var(--list-pad));
            z-index: 2;
            border-radius: calc(var(--radius) - 1px)
                           calc(var(--radius) - 1px) 0 0;
        }
        .group.collapsed .group-head {
            border-radius: calc(var(--radius) - 1px);
            border-bottom: none;
        }
        .group-body > .card:last-child { margin-bottom: 0; }
        .group-head:hover { background: #eef0f3; }
        .group-caret {
            width: 0; height: 0;
            border-left: 5px solid var(--text-soft);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform .15s;
            flex: none;
        }
        .group.collapsed .group-caret { transform: rotate(-90deg); }
        .group-addr {
            flex: 1;
            font-size: 12.5px;
            color: var(--text);
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .group-count {
            flex: none;
            font-size: 11.5px;
            font-weight: 600;
            color: #16a34a;
            background: rgba(22,163,74,.10);
            border-radius: 10px;
            padding: 2px 8px;
            white-space: nowrap;
        }
        .group-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .group.collapsed .group-body { display: none; }
        .group-body .card { margin-bottom: 0; }

        /* Бейдж с числом объектов на маркере группы */
        .group-icon {
            background: #16a34a;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12.5px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
        }
        .group-icon.blue { background: #6b7280; }

        /* ---------- Фильтры-чипы ---------- */
        /* Чипы вместо селекта: видно, сколько объектов за каждой
           категорией, и фильтр в один клик, без выпадающего списка. */
        .chips {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .chip {
            flex: 1;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 5px;
            font: inherit;
            font-size: 12px;
            color: var(--text-soft);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .chip:hover { border-color: var(--border-2); }
        .chip.active {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
            font-weight: 600;
        }
        .chip-n {
            font-size: 11px;
            opacity: .7;
            font-variant-numeric: tabular-nums;
        }

        /* Панель: переключатель вида и сортировка в одну строку,
           чтобы шапка не росла в четыре ряда */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: stretch;
        }
        .toolbar .view-toggle { margin-top: 0; flex: 1; }
        .toolbar #sort {
            font: inherit;
            font-size: 12px;
            color: var(--text-soft);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 4px 6px;
            cursor: pointer;
            max-width: 130px;
        }

        /* ---------- Переключатель вида ---------- */
        .view-toggle {
            display: flex;
            gap: 2px;
            margin-top: 10px;
            padding: 3px;
            background: #eceef1;
            border-radius: 9px;
        }
        .view-toggle button {
            flex: 1;
            font: inherit;
            font-size: 12.5px;
            color: var(--text-soft);
            background: transparent;
            border: 0;
            border-radius: 7px;
            padding: 6px 8px;
            cursor: pointer;
        }
        .view-toggle button.active {
            background: var(--surface);
            color: var(--text);
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0,0,0,.08);
        }

        /* ---------- Дерево по застройщикам ---------- */
        .tree-dev {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            margin-bottom: 8px;
            /* Как и у .group — без overflow:hidden, иначе шапка
               перестаёт липнуть. Углы задаём шапке. */
        }
        .tree-dev.active { border-color: var(--accent); }
        .tree-dev-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            background: var(--surface);
            /* Имя застройщика — тот самый контекст, который терялся
               при прокрутке ветки «ЖК без даты» на 40 позиций. */
            position: sticky;
            top: calc(-1 * var(--list-pad));
            z-index: 3;
            border-radius: calc(var(--radius) - 1px)
                           calc(var(--radius) - 1px) 0 0;
        }
        .tree-dev-head:hover { background: #f6f7f9; }
        .tree-dev.closed .tree-dev-head {
            border-radius: calc(var(--radius) - 1px);
        }
        .tree-dev-name {
            flex: 1;
            min-width: 0;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.35;
        }
        .tree-bin {
            font-size: 11px;
            color: var(--text-soft);
            background: #eceef1;
            border-radius: 4px;
            padding: 1px 5px;
            flex: none;
        }
        .tree-branch { border-top: 1px solid var(--border); }
        .tree-branch-head {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-soft);
            cursor: pointer;
            user-select: none;
            /* Ветка липнет под шапкой застройщика. Смещение задаёт
               renderTree: высота шапки зависит от того, заняло ли
               имя застройщика одну строку или две, и жёстко в CSS
               не угадать. */
            position: sticky;
            top: calc(var(--dev-head-h, 37px) - var(--list-pad));
            z-index: 2;
            background: var(--surface);
        }
        .tree-branch-head:hover { background: #f6f7f9; }
        .tree-branch-tag {
            font-size: 10.5px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 9px;
        }
        .tag-date { color: #16a34a; background: rgba(22,163,74,.12); }
        .tag-nodate { color: #6b7280; background: #eceef1; }
        .tag-orphan { color: #b45309; background: rgba(217,119,6,.14); }
        .tree-items { padding: 2px 12px 10px; }
        .tree-branch.closed .tree-items,
        .tree-branch.closed .tree-caret { display: none; }
        .tree-caret {
            width: 0; height: 0;
            border-left: 5px solid var(--text-soft);
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transition: transform .15s;
            flex: none;
        }
        .tree-branch.closed .tree-caret { transform: rotate(-90deg); }

        .tree-item {
            display: block;
            width: 100%;
            text-align: left;
            font: inherit;
            padding: 7px 0;
            border-top: 1px solid #f0f1f3;
            cursor: pointer;
            background: none;
            border-left: 0; border-right: 0; border-bottom: 0;
        }
        .tree-item:hover .tree-item-title { color: #16a34a; }
        .tree-item-title {
            font-size: 12.5px;
            color: var(--text);
            line-height: 1.35;
        }
        .tree-item-sub {
            font-size: 11.5px;
            color: var(--text-soft);
            line-height: 1.4;
            margin-top: 2px;
        }
        .tree-item-date {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            color: #16a34a;
            background: rgba(22,163,74,.12);
            border-radius: 4px;
            padding: 1px 6px;
            margin-right: 6px;
        }
        .tree-item-date.none { color: #6b7280; background: #eceef1; }
        .tree-orphan-note {
            font-size: 11px;
            color: #b45309;
            margin-top: 3px;
        }
        .tree-orphan-link {
            font-size: 11px;
            color: #2563eb;
            text-decoration: none;
            margin-left: 8px;
        }
        .tree-orphan-link:hover { text-decoration: underline; }

        /* Подсветка маркеров выбранного застройщика */
        .leaflet-marker-icon.dim { opacity: .22; transition: opacity .2s; }
        .leaflet-marker-icon.hi  { opacity: 1; }

        /* ---------- Попап группы: длинный список не должен ломать экран ---------- */
        .zhk-popup-list {
            max-height: 240px;
            overflow-y: auto;
            margin-top: 4px;
        }
        .zhk-popup-more {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            font: inherit;
            font-size: 12px;
            font-weight: 600;
            color: #16a34a;
            background: rgba(22,163,74,.08);
            border: 1px solid rgba(22,163,74,.25);
            border-radius: 7px;
            cursor: pointer;
        }
        .zhk-popup-more:hover { background: rgba(22,163,74,.15); }

        /* Строки внутри попапа группы */
        .zhk-popup-row {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            line-height: 1.4;
        }
        .zhk-popup-row b { display: block; color: var(--text); }
        .zhk-popup-row span { display: block; color: var(--text-soft); }
        .zhk-popup-note {
            margin-top: 4px;
            font-size: 11.5px;
            color: #16a34a;
            font-weight: 600;
        }

        /* ---------- Строка "label: value" ---------- */
        .copy-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 12.5px;
            color: var(--text-soft);
            margin-top: 4px;
            line-height: 1.45;
        }
        .copy-row .label {
            flex: 0 0 auto;
            color: var(--text-mute);
            font-size: 12px;
        }
        .copy-row .value {
            flex: 1 1 auto;
            word-break: break-word;
            color: var(--text);
        }
        .copy-row .copy-btn {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 12px;
            color: var(--text-mute);
            border-radius: 4px;
            line-height: 1;
            opacity: 0;
            transition: opacity .12s, color .12s, background .12s;
        }
        .copy-row:hover .copy-btn { opacity: 1; }
        .copy-row .copy-btn:hover {
            color: var(--accent);
            background: var(--accent-bg);
        }
        .copy-row .copy-btn.copied {
            color: var(--accent);
            opacity: 1;
        }

        .card .code {
            font-size: 11px;
            color: var(--text-mute);
            margin-top: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        /* Строка с кнопкой маршрута и идентификатором проекта */   
        .foot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
        }
        .foot-row .code {
            margin-top: 0;      /* убираем верхний отступ, он теперь у родителя */
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .foot-row .route-btn {
            margin-top: 0;      /* убираем верхний отступ */
            flex: 0 0 auto;
        }

        /* Бейдж «Начало СМР» из данных elicense.kz */
        .license-box {
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--accent-bg);
            border: 1px solid #cdebd8;
            border-radius: 8px;
        }
        .license-start {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .license-cap {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: .8;
            white-space: nowrap;
        }
        .license-date {
            font-size: 13.5px;
            font-weight: 600;
            color: #14532d;
        }
        .license-meta {
            margin-top: 3px;
            font-size: 11.5px;
            color: var(--text-soft);
        }

        /* В попапе маркера бейдж чуть компактнее */
        .zhk-popup .license-box {
            margin: 8px 0;
        }
        .zhk-popup .license-date {
            font-size: 13px;
        }

        /* Кнопка "Маршрут" */
        .route-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 12px;
            padding: 5px 11px;
            background: var(--surface);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            text-decoration: none;
            font-size: 11.5px;
            font-weight: 600;
            transition: background .15s, color .15s;
        }
        .route-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        .route-btn svg { width: 11px; height: 11px; }

        /* Пусто */
        #empty {
            display: none;
            padding: 40px 20px;
            text-align: center;
            font-size: 13px;
            color: var(--text-mute);
        }

        /* ============================================================
           КАРТА
           ============================================================ */
        #map-wrap { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }

        /* Leaflet popup в минималистичном стиле */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
        }
        .leaflet-popup-content { margin: 14px 16px; font-size: 13px; }
        .leaflet-popup-tip { box-shadow: none; }

        /* ============================================================
           LOADER
           ============================================================ */
        #loader {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: rgba(250, 251, 252, 0.96);
            z-index: 10000;
            transition: opacity 0.3s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        #loader .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border-2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        #loader .title {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }
        #loader .subtitle {
            margin-top: 6px;
            font-size: 12.5px;
            color: var(--text-soft);
            max-width: 420px;
            text-align: center;
        }
        #loader .progress-wrap {
            margin-top: 18px;
            width: 280px; height: 4px;
            background: var(--border-2);
            border-radius: 2px;
            overflow: hidden;
        }
        #loader .progress-bar {
            width: 0%; height: 100%;
            background: var(--accent);
            transition: width .25s ease;
        }
        #loader .progress-text {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-mute);
            font-variant-numeric: tabular-nums;
        }
        #loader.error .spinner { display: none; }
        #loader.error .progress-wrap,
        #loader.error .progress-text { display: none; }
        #loader.error .title { color: #dc2626; }
        #loader .error-msg {
            display: none;
            margin-top: 10px;
            max-width: 420px;
            text-align: center;
            font-size: 12.5px;
            color: var(--text-soft);
        }
        #loader.error .error-msg { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ============================================================
           TOAST
           ============================================================ */
        #toast {
            position: fixed;
            left: 50%; bottom: 24px;
            transform: translateX(-50%) translateY(20px);
            background: #1f2328;
            color: #fff;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s, transform .2s;
            z-index: 20000;
            box-shadow: var(--shadow-md);
        }
        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (max-width: 720px) {
            #app { flex-direction: column; }
            #sidebar {
                width: 100%;
                max-width: 100%;
                height: 48vh;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            #map-wrap { height: 52vh; }
            .copy-row .copy-btn { opacity: 1; }  /* на тач-устройствах всегда видны */
        }
    </style>
</head>
<body>

    <div id="app">
        <aside id="sidebar">
            <header>
                <h1>Новое строительство — Астана</h1>
                <div class="meta">
                    <span class="pill"><span id="cnt">0</span> из <span id="cnt-total">0</span></span>
                    <span>ЖК после фильтрации</span>
                </div>

                <div class="search-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input id="search" type="search"
                           placeholder="Поиск по названию, адресу, застройщику…">
                </div>

                <div class="chips" role="group" aria-label="Фильтр">
                    <button type="button" class="chip active" data-filter="all">
                        Все <span class="chip-n" data-count="all">0</span></button>
                    <button type="button" class="chip" data-filter="dated">
                        С датой СМР <span class="chip-n" data-count="dated">0</span></button>
                    <button type="button" class="chip" data-filter="undated">
                        Без даты <span class="chip-n" data-count="undated">0</span></button>
                </div>

                <div class="toolbar">
                    <div class="view-toggle" role="tablist">
                        <button type="button" data-view="list"
                                class="active" role="tab">По адресу</button>
                        <button type="button" data-view="tree"
                                role="tab">По застройщику</button>
                    </div>
                    <select id="sort" title="Порядок в списке">
                        <option value="registry">Как в реестре</option>
                        <option value="date">По дате СМР</option>
                    </select>
                </div>
            </header>
            <div id="list"></div>
            <div id="empty">Ничего не найдено</div>
        </aside>

        <main id="map-wrap"><div id="map"></div></main>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="title">Загружаем ЖК…</div>
        <div class="subtitle" id="loader-subtitle">Подключаемся к серверу…</div>
        <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="progress-text" id="progress-text">0 / 0</div>
        <div class="error-msg" id="loader-error"></div>
    </div>

    <!-- Toast -->
    <div id="toast">Скопировано</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script>
        // ============================================================
        // 0. Loader
        // ============================================================
        const loader       = document.getElementById('loader');
        const loaderTitle  = loader.querySelector('.title');
        const loaderSub    = document.getElementById('loader-subtitle');
        const progressBar  = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const loaderError  = document.getElementById('loader-error');

        function hideLoader() { loader.classList.add('hidden'); }
        function failLoader(msg) {
            loader.classList.add('error');
            loaderTitle.textContent = 'Ошибка загрузки';
            loaderSub.textContent = '';
            loaderError.textContent = msg || '';
        }
        function updateProgress(current, total, subtitle) {
            const pct = total > 0 ? (current / total) * 100 : 0;
            progressBar.style.width = pct.toFixed(1) + '%';
            progressText.textContent = `${current} / ${total}`;
            if (subtitle) loaderSub.textContent = subtitle;
        }

        // ============================================================
        // 1. Карта
        // ============================================================
        const map = L.map('map', {
            updateWhenIdle: true, updateWhenZooming: false, keepBuffer: 2,
            zoomControl: false
        }).setView([51.128, 71.430], 11);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            referrerPolicy: 'strict-origin-when-cross-origin',
            crossOrigin: true
        }).addTo(map);

        // Маркеры: зелёный — есть дата начала СМР, серый — уведомлений
        // не найдено. Цвет выбирается по наличию даты.
        function makeIcon(color) {
            return L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25,41], iconAnchor: [12,41],
                popupAnchor: [1,-34], shadowSize: [41,41]
            });
        }
        const greenIcon = makeIcon('green');
        const greyIcon  = makeIcon('grey');

        // Маркер группы: круг с числом объектов на этом адресе.
        function makeGroupIcon(n, withLicense) {
            return L.divIcon({
                className: '',
                html: `<div class="group-icon${withLicense ? '' : ' blue'}">${n}</div>`,
                // .blue здесь — историческое имя класса, означает «серый»:
                // в группе зелёная, если хотя бы у одного объекта есть
                // дата начала СМР
                iconSize: [30, 30],
                iconAnchor: [15, 15],
                popupAnchor: [0, -16]
            });
        }

        // Ключ группы: тот же адрес — та же группа.
        // Нормализуем регистр и пробелы, чтобы «ул. Е 117» и «ул.  Е117»
        // не разъехались по разным группам.
        function groupKey(zhk) {
            return (zhk.address || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        // ============================================================
        // 2. Данные
        // ============================================================
        const zhkList     = [];
        const markersById = new Map();
        const cardsById   = new Map();

        // Данные elicense.kz, пришедшие отдельным запросом:
        // licensesById → { start_date, bin, company, notifications[] }
        const licensesById = new Map();

        // Уведомления о начале СМР, которым не нашлось ЖК в реестре
        // проектов: новостройка есть на elicense, но её ещё нет в
        // qportal. Настоящие уведомления, показывать их больше негде,
        // кроме отдельной ветки. Приходят из /api/licenses.
        let orphanNotifs = [];

        // Что показано в боковой панели:
        //   'list' — карточки, сгруппированные по адресу;
        //   'tree' — дерево по застройщикам.
        let currentView = 'list';
        let selectedBin = null;

        // Активный чип-фильтр: 'all' | 'dated' | 'undated'.
        // Живёт рядом с currentView, потому что применяется к обоим видам.
        let currentFilter = 'all';

        const listEl     = document.getElementById('list');
        const emptyEl    = document.getElementById('empty');
        const cntEl      = document.getElementById('cnt');
        const cntTotalEl = document.getElementById('cnt-total');
        const searchEl   = document.getElementById('search');
        const sortEl     = document.getElementById('sort');

        // ============================================================
        // 3. Хелперы
        // ============================================================
        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, ch => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[ch]));
        }

        function cutTail(s) {
            return s.replace(/,? (расположенный )?по адресу:?.*/g, "");
        }

        function route2gisUrl(zhk) {
            return `https://2gis.ru/directions/points/%7C${zhk.lon},${zhk.lat}`;
        }

        // === Toast + Clipboard ===
        const toastEl = document.getElementById('toast');
        let toastTimer = null;

        function showToast(text) {
            toastEl.textContent = text || 'Скопировано';
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
        }

        document.addEventListener('click', async (e) => {
            const btn = e.target.closest('.copy-btn');
            if (!btn) return;
            e.stopPropagation();
            e.preventDefault();

            const text = btn.dataset.copy || '';
            if (!text) return;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                }
                btn.classList.add('copied');
                btn.textContent = '✓';
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '⧉';
                }, 1200);
                showToast('Скопировано: ' + (text.length > 40 ? text.slice(0,40) + '…' : text));
            } catch (err) {
                console.error('Не удалось скопировать:', err);
                showToast('Ошибка копирования');
            }
        });

        function copyRow(label, value, cls) {
            if (!value) return '';
            const v = escapeHtml(value);
            const raw = escapeHtml(value).replace(/'/g, '&#39;');
            return `
                <div class="copy-row${cls ? ' ' + cls : ''}">
                    <span class="label">${label}</span>
                    <span class="value">${v}</span>
                    <button class="copy-btn" type="button"
                            title="Скопировать"
                            data-copy="${raw}">⧉</button>
                </div>`;
        }

        const ROUTE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                           </svg>`;

        // ============================================================
        // 3.1 Данные elicense.kz: дата начала строительства
        // ============================================================
        const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня',
                            'июля','августа','сентября','октября','ноября','декабря'];

        function formatDateRu(iso) {
            if (!iso) return '';
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
            if (!m) return iso;
            return `${+m[3]} ${MONTHS_GEN[+m[2] - 1]} ${m[1]}`;
        }

        function licenseOf(id) {
            return licensesById.get(id) || null;
        }

        function pluralRu(n, one, few, many) {
            const m10 = n % 10, m100 = n % 100;
            if (m10 === 1 && m100 !== 11) return one;
            if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
            return many;
        }

        // Бейдж с датой начала СМР — и в карточке списка, и в попапе
        function licenseBadge(id) {
            const lic = licenseOf(id);
            if (!lic) return '';
            const count = (lic.notifications || []).length;
            const word = pluralRu(count, 'уведомление', 'уведомления', 'уведомлений');
            return `
                <div class="license-box">
                    <div class="license-start">
                        <span class="license-cap">Начало СМР</span>
                        <span class="license-date">${escapeHtml(formatDateRu(lic.start_date)) || '—'}</span>
                    </div>
                    <div class="license-meta">
                        ${count} ${word}
                        ${lic.bin ? ` · БИН ${escapeHtml(lic.bin)}` : ''}
                        ${lic.method === 'geocode' ? ' · по адресу' : ''}
                    </div>
                </div>`;
        }

        function popupHtml(zhk) {
            return `
                <div class="zhk-popup">
                    <b>${escapeHtml(cutTail(zhk.name)) || '—'}</b>
                    ${licenseBadge(zhk.id)}
                    ${copyRow('Адрес:', zhk.address)}
                    ${copyRow('Застройщик:', zhk.customer)}
                    ${zhk.customer_bin ? copyRow('БИН:', zhk.customer_bin) : ''}
                    <div class="foot-row">
                        <span class="code">${escapeHtml(zhk.code) || ''}</span>
                        <a class="route-btn" target="_blank" href="${route2gisUrl(zhk)}">
                            ${ROUTE_SVG} Маршрут
                        </a>
                    </div>
                </div>`;
        }
        
        // Адрес помечен классом .addr: карточки строятся по мере прихода
        // SSE, до того как известно, попадёт объект в группу или нет.
        // Поэтому адрес не убираем из разметки, а прячем классом
        // .in-group, который ставит buildGroups. Иначе пришлось бы
        // перерисовывать карточку и терять бейдж с датой и класс active.
        // БИН убран совсем: двенадцать цифр в списке не читают, а в
        // попапе он есть.
        function cardHtml(zhk) {
            const route = route2gisUrl(zhk);
            return `
                <div class="title">${escapeHtml(cutTail(zhk.name)) || '—'}</div>
                ${licenseBadge(zhk.id)}
                ${copyRow('Адрес:', zhk.address, 'addr')}
                ${copyRow('Застройщик:', zhk.customer)}
                <div class="foot-row">
                    <span class="code">${escapeHtml(zhk.code) || ''}</span>
                    <a class="route-btn" target="_blank"
                       href="${route}"
                       onclick="event.stopPropagation()">
                        ${ROUTE_SVG} Маршрут
                    </a>
                </div>`;
        }
        
        // ============================================================
        // 4. Связка карта ↔ список
        // ============================================================
        let activeId = null;
        function setActiveCard(id) {
            if (activeId && cardsById.has(activeId)) {
                cardsById.get(activeId).classList.remove('active');
            }
            activeId = id;
            if (id && cardsById.has(id)) {
                const card = cardsById.get(id);
                card.classList.add('active');
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }
        function focusOnZhk(id) {
            const entry = markersById.get(id);
            if (!entry) return;
            const { marker } = entry;
            map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14), { animate: true });
            marker.openPopup();
            setActiveCard(id);
        }

        // ============================================================
        // 5. Добавление ЖК
        // ============================================================
        function addZhkToUI(zhk) {
            const marker = L.marker([zhk.lat, zhk.lon], { icon: greenIcon });
            marker.bindPopup(popupHtml(zhk));
            marker.on('click', () => {
                setActiveCard(zhk.id);
                marker.openPopup();
            });
            marker.addTo(map);
            markersById.set(zhk.id, { marker, zhk });

            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = zhk.id;
            card.innerHTML = cardHtml(zhk);
            card.addEventListener('click', (e) => {
                if (e.target.closest('.copy-btn')) return;
                if (e.target.closest('.route-btn')) return;
                focusOnZhk(zhk.id);
            });
            listEl.appendChild(card);
            cardsById.set(zhk.id, card);

            cntEl.textContent = zhkList.length + 1;

            if (zhkList.length < 3) {
                const bounds = [];
                markersById.forEach(({ marker }) => bounds.push(marker.getLatLng()));
                if (bounds.length >= 2) {
                    map.fitBounds(L.latLngBounds(bounds), { padding: [30, 30], animate: true });
                } else if (bounds.length === 1) {
                    map.setView(bounds[0], 13, { animate: true });
                }
            }
        }

        // ============================================================
        // 5a. Группировка по адресу
        // ============================================================
        // Объекты на одном адресе — это разные ЖК разных застройщиков
        // (на «Жұмекен Нәжімеденова» их 12), и по одному маркеру на
        // объект они накладываются в неразличимую кучу. Поэтому после
        // загрузки всех данных маркеры схлопываются по адресу, а в
        // списке объекты одного адреса объединяются под общий заголовок.
        const groupsByKey = new Map();
        const expandedGroups = new Set();   // ключи адресов с развёрнутым попапом

        function pluralZhk(n) {
            const m10 = n % 10, m100 = n % 100;
            if (m10 === 1 && m100 !== 11) return n + ' объект';
            if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) {
                return n + ' объекта';
            }
            return n + ' объектов';
        }

        function groupPopupHtml(group) {
            // На одном адресе бывает до 12 объектов, и полный список
            // в попапе не помещается на экран. Поэтому показываем первые
            // несколько, остальные — по кнопке, и дополнительно
            // ограничиваем высоту прокруткой.
            const LIMIT = 4;
            const expanded = expandedGroups.has(group.key);
            const shown = expanded ? group.items : group.items.slice(0, LIMIT);
            const rest = group.items.length - shown.length;

            const rows = shown.map(z =>
                '<div class="zhk-popup-row">' +
                '<b>' + (escapeHtml(cutTail(z.name)) || '—') + '</b>' +
                '<span>' + escapeHtml(z.customer || '—') + '</span>' +
                (z.customer_bin
                    ? '<span class="code">' + escapeHtml(z.customer_bin) + '</span>'
                    : '') +
                '</div>').join('');

            const word = pluralRu(group.items.length,
                                  'объект', 'объекта', 'объектов');

            return '<div class="zhk-popup">' +
                   '<b>' + escapeHtml(group.address) + '</b>' +
                   '<div class="zhk-popup-note">' +
                       group.items.length + ' ' + word + ' на этом адресе</div>' +
                   '<div class="zhk-popup-list">' + rows + '</div>' +
                   (rest > 0
                       ? '<button class="zhk-popup-more" data-group="' +
                         encodeURIComponent(group.key) + '">показать ещё ' +
                         rest + '</button>'
                       : (expanded && group.items.length > LIMIT
                           ? '<button class="zhk-popup-more" data-group="' +
                             encodeURIComponent(group.key) + '">свернуть</button>'
                           : '')) +
                   '</div>';
        }

        // Кнопка «показать ещё» в попапе: список разворачивается по
        // клику, без перерисовки самого попапа целиком.
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.zhk-popup-more');
            if (!btn) return;
            e.stopPropagation();

            const key = decodeURIComponent(btn.dataset.group);
            const group = groupsByKey.get(key);
            if (!group) return;

            if (expandedGroups.has(key)) expandedGroups.delete(key);
            else expandedGroups.add(key);

            group.marker.setPopupContent(groupPopupHtml(group));
            group.marker.openPopup();
        });

        function buildGroups() {
            // Раскладываем объекты по адресу, сохраняя порядок появления
            const order = [];
            const byKey = new Map();
            zhkList.forEach(zhk => {
                const key = groupKey(zhk);
                if (!byKey.has(key)) {
                    byKey.set(key, { key: key,
                                     address: zhk.address || '—',
                                     items: [] });
                    order.push(key);
                }
                byKey.get(key).items.push(zhk);
            });

            // --- Маркеры: по одному на адрес ---
            markersById.forEach(entry => {
                if (map.hasLayer(entry.marker)) map.removeLayer(entry.marker);
            });
            markersById.clear();
            groupsByKey.clear();

            order.forEach(key => {
                const group = byKey.get(key);
                const first = group.items[0];
                // Признак берём из licensesById, а не из разметки: карточка с
                // датой появляется позже, чем строятся группы, и
                // поиск по data-badge (которого в разметке нет) всегда
                // давал «нет данных» — маркеры оставались серыми.
                const hasLicense = group.items.some(z =>
                    licensesById.has(z.id));

                const marker = L.marker([first.lat, first.lon], {
                    icon: group.items.length > 1
                        ? makeGroupIcon(group.items.length, hasLicense)
                        : (hasLicense ? greenIcon : greyIcon)
                });

                const entry = { key: key, address: group.address,
                                items: group.items, marker: marker,
                                el: null };
                groupsByKey.set(key, entry);

                marker.bindPopup(group.items.length > 1
                    ? groupPopupHtml(group)
                    : popupHtml(first));

                marker.on('click', () => {
                    if (group.items.length > 1 && entry.el) {
                        entry.el.classList.remove('collapsed');
                    }
                    setActiveCard(first.id);
                });
                marker.addTo(map);

                // Внутри группы запоминаем общий маркер, чтобы клик по
                // карточке работал так же, как раньше
                group.items.forEach(zhk => {
                    markersById.set(zhk.id, { marker: marker, zhk: zhk });
                });
            });

            // --- Список: карточки одного адреса под общим заголовком ---
            const frag = document.createDocumentFragment();
            order.forEach(key => {
                const group = byKey.get(key);
                const inGroup = group.items.length > 1;

                // Адрес в карточке группы дублировал заголовок группы
                group.items.forEach(z => {
                    const card = cardsById.get(z.id);
                    if (card) card.classList.toggle('in-group', inGroup);
                });

                if (!inGroup) {
                    group.items.forEach(z => {
                        const card = cardsById.get(z.id);
                        if (card) frag.appendChild(card);
                    });
                    return;
                }

                const el = document.createElement('div');
                el.className = 'group';
                el.dataset.key = key;

                const head = document.createElement('div');
                head.className = 'group-head';
                head.innerHTML =
                    '<span class="group-caret"></span>' +
                    '<span class="group-addr">' +
                        escapeHtml(group.address) + '</span>' +
                    '<span class="group-count">' +
                        pluralZhk(group.items.length) + '</span>';

                const body = document.createElement('div');
                body.className = 'group-body';
                group.items.forEach(z => {
                    const card = cardsById.get(z.id);
                    if (card) body.appendChild(card);
                });

                head.addEventListener('click', (e) => {
                    if (e.target.closest('.copy-btn')) return;
                    el.classList.toggle('collapsed');
                    if (!el.classList.contains('collapsed')) {
                        map.setView(groupsByKey.get(key).marker.getLatLng(),
                                    Math.max(map.getZoom(), 14),
                                    { animate: true });
                    }
                });

                el.appendChild(head);
                el.appendChild(body);
                frag.appendChild(el);
                groupsByKey.get(key).el = el;
            });

            listEl.innerHTML = '';
            listEl.appendChild(frag);
        }

        // ============================================================
        // 5b. Сортировка списка
        // ============================================================
        // Сортируются блоки (одиночная карточка или группа по адресу),
        // а внутри группы — сами карточки. Блоки переиспользуются:
        // карточки переносится по DOM, обработчики и класс active
        // при этом сохраняются.
        function startDateOf(zhk) {
            const lic = licensesById.get(zhk.id);
            return (lic && lic.start_date) || null;
        }

        // Дата выдачи уведомления. У элементов ветки сирот поле называется
        // issue_date, но в него кладётся issue_date_iso из zhk_match.py,
        // то есть это ISO-строка — сравнение лексикографическое и
        // «12» идёт раньше «2». На всякий случай берём и ISO-вариант.
        function notifDate(n) {
            return n.issue_date_iso || n.issue_date || '';
        }

        // От новых к старым. Без даты уходят в конец: поставить такое
        // уведомление вперёд — значит показать пользователю пустоту.
        function cmpByIssueDateDesc(a, b) {
            const da = notifDate(a), db = notifDate(b);
            if (!da && !db) return 0;
            if (!da) return 1;
            if (!db) return -1;
            return da < db ? 1 : (da > db ? -1 : 0);
        }

        function cmpDeveloper(a, b) {
            return (a.customer || '').localeCompare(b.customer || '', 'ru');
        }

        function cmpStartDate(a, b) {
            const da = startDateOf(a), db = startDateOf(b);
            // Без уведомлений — в конец: дата неизвестна, сортировать
            // такие объекты между собой бессмысленно.
            if (!da && !db) return 0;
            if (!da) return 1;
            if (!db) return -1;
            return da < db ? -1 : (da > db ? 1 : 0);
        }

        // Ключ блока: для группы — самая ранняя дата среди её объектов,
        // иначе сравнивать блоки между собой было бы нечем.
        function blockDate(g) {
            const dates = g.items.map(startDateOf).filter(Boolean).sort();
            return dates.length ? dates[0] : null;
        }

        function blockDeveloper(g) {
            const names = g.items.map(z => z.customer || '')
                .sort((a, b) => a.localeCompare(b, 'ru'));
            return names.length ? names[0] : '';
        }

        function sortList(mode) {
            const blocks = Array.from(groupsByKey.values());

            if (mode === 'developer' || mode === 'date') {
                const cmp = mode === 'developer' ? cmpDeveloper : cmpStartDate;
                blocks.forEach(g => {
                    if (g.items.length > 1) g.items.sort(cmp);
                });
            }

            if (mode === 'developer') {
                blocks.sort((a, b) => {
                    const r = blockDeveloper(a).localeCompare(
                        blockDeveloper(b), 'ru');
                    return r || a.key.localeCompare(b.key, 'ru');
                });
            } else if (mode === 'date') {
                blocks.sort((a, b) => {
                    const da = blockDate(a), db = blockDate(b);
                    if (!da && !db) return a.key.localeCompare(b.key, 'ru');
                    if (!da) return 1;
                    if (!db) return -1;
                    return da < db ? -1 : (da > db ? 1 : 0);
                });
            }
            // mode === 'registry' — порядок реестра, ничего не трогаем

            const frag = document.createDocumentFragment();
            blocks.forEach(g => {
                if (g.items.length < 2) {
                    const card = cardsById.get(g.items[0].id);
                    if (card) frag.appendChild(card);
                } else {
                    const body = g.el.querySelector('.group-body');
                    g.items.forEach(z => {
                        const card = cardsById.get(z.id);
                        if (card) body.appendChild(card);
                    });
                    frag.appendChild(g.el);
                    // Попап показывает объекты в том же порядке
                    if (g.marker.getPopup()) {
                        g.marker.setPopupContent(groupPopupHtml(g));
                    }
                }
            });

            listEl.innerHTML = '';
            listEl.appendChild(frag);
            applyFilter();
        }

        // ============================================================
        // 5.5 Данные elicense.kz: подтягиваем даты и красим маркеры
        // ============================================================
        function applyLicenses(licenses) {
            licensesById.clear();
            Object.keys(licenses || {}).forEach(k => {
                licensesById.set(k, licenses[k]);
            });

            let painted = 0;

            // Иконку маркера здесь НЕ трогаем: после группировки одному
            // адресу соответствует один маркер на несколько объектов,
            // и setIcon по объекту затирал бы иконку группы с числом.
            // Цвет пересчитывается ниже, по группам.
            markersById.forEach(({ zhk }, id) => {
                if (!licensesById.has(id)) return;
                painted++;

                // В карточке меняем только сам бейдж, карточку не пересоздаём —
                // иначе теряется класс active и навешиваются дубли обработчиков
                const card = cardsById.get(id);
                if (card) {
                    const old = card.querySelector('.license-box');
                    if (old) old.remove();

                    const title = card.querySelector('.title');
                    const tmp = document.createElement('div');
                    tmp.innerHTML = licenseBadge(id);
                    const badge = tmp.firstElementChild;
                    if (badge) title.insertAdjacentElement('afterend', badge);
                }
            });

            // Попапы и иконки маркеров — целиком по группам
            groupsByKey.forEach(g => {
                const hasLicense = g.items.some(z => licensesById.has(z.id));
                const isGroup = g.items.length > 1;
                g.marker.__isGroup = isGroup;
                g.marker.setIcon(isGroup
                    ? makeGroupIcon(g.items.length, hasLicense)
                    : (hasLicense ? greenIcon : greyIcon));
                if (g.marker.getPopup()) {
                    g.marker.setPopupContent(isGroup
                        ? groupPopupHtml(g)
                        : popupHtml(g.items[0]));
                }
            });

            if (painted) console.log(`[elicense] окрашено маркеров: ${painted}`);

            // Даты приходят после списка, поэтому сортировку по дате
            // пересчитываем ещё раз — иначе порядок был бы по пустым
            // значениям.
            if (groupsByKey.size) sortList(sortEl.value);

            return painted;
        }

        async function loadLicenses() {
            // Сервер отдаёт 503, если список ЖК ещё не собран. Так бывает
            // и сразу после окончания SSE: сборка может занять больше
            // времени жизни кэша, и к моменту запроса он протухает.
            // Повторяем с ?wait=1 — пересборка идёт по кэшу геокодирования
            // и занимает секунды.
            const tryLoad = async (withWait) => {
                const res = await fetch('/api/licenses' + (withWait ? '?wait=1' : ''));
                if (res.status === 503) return null;
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'ошибка');
                return data;
            };

            try {
                let data = await tryLoad(false);
                if (!data) data = await tryLoad(true);
                if (!data) throw new Error('список ЖК не собран');

                const painted = applyLicenses(data.licenses);
                // От новых к старым: уведомление о начале СМР интересно
                // прежде всего свежее, а порядок сервера по убыванию
                // id даёт наоборот — от старых к новым. Сортируем
                // копию, исходный массив ответа не трогаем.
                orphanNotifs = (data.unmatched || []).slice()
                    .sort(cmpByIssueDateDesc);
                if (currentView === 'tree') renderTree();

                const s = data.stats || {};
                console.log(`[elicense] уведомлений: ${s.notifications}, ` +
                            `по БИН: ${s.matched_bin}, по адресу: ${s.matched_geocode}, ` +
                            `без сопоставления: ${s.no_match}, ` +
                            `маркеров с датой: ${painted}`);

                if (s.no_match) {
                    console.warn('[elicense] не сопоставлено:', data.unmatched);
                }
            } catch (e) {
                // Не критично: карта и список работают и без этих данных
                console.warn('[elicense] не удалось загрузить даты:', e.message);
            }
        }

        // ============================================================
        // 6. Поиск
        // ============================================================
        const closedBranches = new Set();

        function treeItemHtml(zhk) {
            const lic = licensesById.get(zhk.id);
            const date = lic ? formatDateRu(lic.start_date) : null;
            return '<button type="button" class="tree-item" data-id="' +
                escapeHtml(zhk.id) + '">' +
                '<div class="tree-item-title">' +
                    (date
                        ? '<span class="tree-item-date">' +
                          escapeHtml(date) + '</span>'
                        : '<span class="tree-item-date none">без даты</span>') +
                    escapeHtml(cutTail(zhk.name) || '—') +
                '</div>' +
                '<div class="tree-item-sub">' +
                    escapeHtml(zhk.address || '') + '</div>' +
                '</button>';
        }

        function treeOrphanHtml(n) {
            const link = n.detail_url
                ? '<a class="tree-orphan-link" target="_blank" href="' +
                  escapeHtml(n.detail_url) +
                  '" onclick="event.stopPropagation()">elicense</a>'
                : '';
            return '<div class="tree-item">' +
                '<div class="tree-item-title">' +
                    '<span class="tree-item-date">' +
                        escapeHtml(formatDateRu(n.issue_date) || '—') +
                    '</span>' +
                    escapeHtml(cutTail(n.object_name) || 'уведомление') +
                '</div>' +
                '<div class="tree-item-sub">' +
                    escapeHtml(n.address || 'адрес не извлечён') + link +
                '</div>' +
                '<div class="tree-orphan-note">Объекта нет в реестре ' +
                    'проектов — ЖК на карте не показан</div>' +
                '</div>';
        }

        function branchHtml(id, label, count, tagClass, bodyHtml) {
            const closed = closedBranches.has(id);
            return '<div class="tree-branch' + (closed ? ' closed' : '') +
                '" data-branch="' + escapeHtml(id) + '">' +
                '<div class="tree-branch-head">' +
                    '<span class="tree-caret"></span>' +
                    '<span class="tree-branch-tag ' + tagClass + '">' +
                        count + '</span>' +
                    '<span>' + escapeHtml(label) + '</span>' +
                '</div>' +
                '<div class="tree-items">' + bodyHtml + '</div>' +
                '</div>';
        }

        function renderTree() {
            // Раскладываем ЖК и уведомления-сироты по застройщику
            const devs = new Map();
            zhkList.forEach(z => {
                const key = z.customer_bin || ('n:' + (z.customer || '—'));
                if (!devs.has(key)) {
                    devs.set(key, {
                        key: key, bin: z.customer_bin || null,
                        name: z.customer || 'Застройщик не указан',
                        zhk: [], orphans: []
                    });
                }
                devs.get(key).zhk.push(z);
            });

            // Застройщик, у которого в реестре нет ни одного ЖК,
            // но есть уведомления, тоже должен быть виден
            orphanNotifs.forEach(n => {
                const key = n.bin || ('n:' + (n.company || '—'));
                if (!devs.has(key)) {
                    devs.set(key, {
                        key: key, bin: n.bin || null,
                        name: n.company || 'Застройщик не указан',
                        zhk: [], orphans: []
                    });
                }
                devs.get(key).orphans.push(n);
            });

            const list = Array.from(devs.values()).sort((a, b) =>
                a.name.localeCompare(b.name, 'ru'));

            const frag = document.createDocumentFragment();
            list.forEach(dev => {
                const el = document.createElement('div');
                el.className = 'tree-dev';
                if (dev.bin && dev.bin === selectedBin) el.classList.add('active');

                const head = document.createElement('div');
                head.className = 'tree-dev-head';
                head.innerHTML =
                    '<span class="tree-caret"></span>' +
                    '<span class="tree-dev-name">' +
                        escapeHtml(dev.name) + '</span>' +
                    (dev.bin ? '<span class="tree-bin">' +
                              escapeHtml(dev.bin) + '</span>' : '');

                const withDate = dev.zhk.filter(z => licensesById.has(z.id))
                    .sort((a, b) => (startDateOf(a) || '9999')
                        .localeCompare(startDateOf(b) || '9999'));
                const noDate = dev.zhk.filter(z => !licensesById.has(z.id));
                // От новых к старым. Раньше здесь стоял localeCompare
                // по возрастанию, и уведомления шли от старых к новым.
                const orphans = dev.orphans.slice()
                    .sort(cmpByIssueDateDesc);

                head.addEventListener('click', () => {
                    // Повторный клик по тому же застройщику снимает выбор
                    selectedBin = (dev.bin && dev.bin === selectedBin)
                        ? null : dev.bin;
                    highlightMarkers();
                    renderTree();
                });
                el.appendChild(head);

                if (withDate.length) {
                    el.insertAdjacentHTML('beforeend', branchHtml(
                        'd:' + dev.key, 'ЖК с датой начала СМР',
                        withDate.length, 'tag-date',
                        withDate.map(treeItemHtml).join('')));
                }
                if (noDate.length) {
                    el.insertAdjacentHTML('beforeend', branchHtml(
                        'n:' + dev.key, 'ЖК без даты',
                        noDate.length, 'tag-nodate',
                        noDate.map(treeItemHtml).join('')));
                }
                if (orphans.length) {
                    el.insertAdjacentHTML('beforeend', branchHtml(
                        'o:' + dev.key, 'Уведомления без ЖК в реестре',
                        orphans.length, 'tag-orphan',
                        orphans.map(treeOrphanHtml).join('')));
                }
                frag.appendChild(el);
            });

            listEl.innerHTML = '';
            listEl.appendChild(frag);
            bindTreeHandlers();
            measureDevHeads();
            applyFilter();
        }

        // Ширина шапки застройщика зависит от того, заняло ли имя одну
        // строку или две, поэтому высоту липких веток задаём из JS:
        // в CSS жёсткое значение либо оставляло бы щель, либо
        // наезжало на имя второй строки.
        function measureDevHeads() {
            listEl.querySelectorAll('.tree-dev').forEach(dev => {
                const head = dev.querySelector('.tree-dev-head');
                if (head) {
                    dev.style.setProperty('--dev-head-h',
                                         head.offsetHeight + 'px');
                }
            });
        }

        function bindTreeHandlers() {
            listEl.querySelectorAll('.tree-branch-head').forEach(h => {
                h.addEventListener('click', () => {
                    const branch = h.closest('.tree-branch');
                    const id = branch.dataset.branch;
                    if (closedBranches.has(id)) closedBranches.delete(id);
                    else closedBranches.add(id);
                    branch.classList.toggle('closed');
                });
            });
            listEl.querySelectorAll('.tree-item[data-id]').forEach(b => {
                b.addEventListener('click', () => focusOnZhk(b.dataset.id));
            });
        }

        // Подсветка маркеров выбранного застройщика: остальные гаснут,
        // но не исчезают — так видна и общая картина, и выбранный.
        function highlightMarkers() {
            markersById.forEach(function(entry) {
                var el = entry.marker.getElement();
                if (!el) return;
                if (!selectedBin) {
                    el.classList.remove('dim', 'hi');
                } else if (entry.zhk.customer_bin === selectedBin) {
                    el.classList.remove('dim');
                    el.classList.add('hi');
                } else {
                    el.classList.add('dim');
                    el.classList.remove('hi');
                }
            });
        }

        // Ширина панели меняется — длинное имя застройщика перестаёт
        // помещаться в одну строку, и липкие ветки поедут. Пересчитываем
        // после того, как браузер пересчитал вёрстку.
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (currentView === 'tree') measureDevHeads();
            }, 150);
        });

        // Переключение вида: список по адресу и дерево по застройщикам
        // делят один контейнер
        document.querySelectorAll('.view-toggle button').forEach(function(btn) {
            btn.addEventListener('click', function() {
                currentView = btn.dataset.view;
                document.querySelectorAll('.view-toggle button')
                    .forEach(function(b) { b.classList.toggle('active', b === btn); });

                // Сортировка относится только к списку по адресу
                var so = document.getElementById('sort');
                if (so) so.style.display = currentView === 'list' ? '' : 'none';

                if (currentView === 'tree') {
                    selectedBin = null;
                    highlightMarkers();
                    renderTree();
                    // Дерево строилось заново, поэтому фильтр
                    // по дате на нём ещё не применён.
                    applyFilter();
                } else {
                    buildGroups();
                    sortList(sortEl.value);
                }
            });
        });

        function matchesFilter(zhk, q) {
            if (currentFilter === 'dated' && !licensesById.has(zhk.id)) {
                return false;
            }
            if (currentFilter === 'undated' && licensesById.has(zhk.id)) {
                return false;
            }
            if (!q) return true;
            return (zhk.name || '').toLowerCase().includes(q) ||
                (zhk.address || '').toLowerCase().includes(q) ||
                (zhk.customer || '').toLowerCase().includes(q) ||
                (zhk.customer_bin || '').toLowerCase().includes(q) ||
                (zhk.designer || '').toLowerCase().includes(q) ||
                (zhk.code || '').toLowerCase().includes(q);
        }

        // Счётчики на чипах: сколько ЖК в каждой категории.
        // Считаем по полному списку, а не по результату поиска —
        // иначе число прыгало бы вслед за текстом в поле.
        function updateChipCounts() {
            let dated = 0;
            zhkList.forEach(z => { if (licensesById.has(z.id)) dated++; });
            const all = zhkList.length;
            const set = (name, value) => {
                const el = document.querySelector('[data-count="' + name + '"]');
                if (el) el.textContent = value;
            };
            set('all', all);
            set('dated', dated);
            set('undated', all - dated);
        }

        function applyFilter() {
            const q = searchEl.value.trim().toLowerCase();
            const visibleIds = new Set();
            let visibleCount = 0;

            zhkList.forEach(zhk => {
                if (matchesFilter(zhk, q)) {
                    visibleIds.add(zhk.id);
                    visibleCount++;
                }
            });

            // --- Карточки списка ---
            cardsById.forEach((card, id) => {
                card.style.display = visibleIds.has(id) ? '' : 'none';
            });

            // --- Пункты дерева ---
            listEl.querySelectorAll('.tree-item[data-id]').forEach(el => {
                el.style.display = visibleIds.has(el.dataset.id) ? '' : 'none';
            });

            // --- Заголовки групп в списке по адресу ---
            // Прячем, только если скрыты все объекты внутри: иначе
            // остаётся шапка без содержимого. Счётчик в шапке
            // пересчитываем: он обязан совпадать с числом на маркере,
            // иначе «12 объектов» при двух видимых выглядит ошибкой.
            listEl.querySelectorAll('.group').forEach(el => {
                const shown = Array.from(el.querySelectorAll('.card'))
                    .filter(c => c.style.display !== 'none').length;
                el.style.display = shown ? '' : 'none';
                const badge = el.querySelector('.group-count');
                if (badge) badge.textContent = pluralZhk(shown);
            });

            // --- Ветки и застройщики в дереве ---
            listEl.querySelectorAll('.tree-branch').forEach(branch => {
                const anyItem = Array.from(branch.querySelectorAll('.tree-item'))
                    .some(i => i.style.display !== 'none');
                // Ветка уведомлений-сирот: у них нет id ЖК, поэтому фильтр
                // «без даты» их не касается — они и есть уведомления
                // о начале СМР. Под «все» и «с датой» показываем.
                const id = branch.dataset.branch || '';
                const keep = id.startsWith('o:')
                    ? currentFilter !== 'undated' : anyItem;
                branch.style.display = keep ? '' : 'none';

                const dev = branch.closest('.tree-dev');
                if (dev) {
                    const anyBranch = Array.from(
                        dev.querySelectorAll('.tree-branch'))
                        .some(b => b.style.display !== 'none');
                    dev.style.display = anyBranch ? '' : 'none';
                }
            });

            // --- Маркеры ---
            // Один маркер на адрес: он остаётся на карте, если виден
            // хоть один объект группы, а число на бейдже пересчитывается.
            // Иначе при фильтре «с датой СМР» зелёный маркер писал бы
            // «12» — про весь адрес, а не про то, что осталось видно.
            groupsByKey.forEach(g => {
                const shown = g.items.filter(z => visibleIds.has(z.id)).length;
                if (!shown) {
                    if (map.hasLayer(g.marker)) map.removeLayer(g.marker);
                    return;
                }
                // Проверяем именно hasLayer, а не наличие DOM-элемента:
                // у снятого маркера getElement() вернёт null, и обратно
                // на карту он уже не вернулся бы никогда.
                if (!map.hasLayer(g.marker)) g.marker.addTo(map);

                const isGroup = g.items.length > 1;
                if (!isGroup) return;

                const hasLicense = g.items.some(z => licensesById.has(z.id));
                const el = g.marker.getElement();
                const badge = el && el.querySelector('.group-icon');
                if (!badge || badge.textContent !== String(shown)) {
                    g.marker.setIcon(makeGroupIcon(shown, hasLicense));
                }
            });

            emptyEl.style.display = visibleCount === 0 ? 'block' : 'none';
            cntEl.textContent = visibleCount;

            // Счётчики на чипах обновляем здесь же: applyFilter зовётся и
            // после загрузки списка, и после прихода дат, и при вводе
            // в поиск. Отдельный вызов в трёх местах однажды разъехался бы.
            updateChipCounts();
        }
        searchEl.addEventListener('input', applyFilter);

        document.querySelectorAll('.chip').forEach(btn => {
            btn.addEventListener('click', () => {
                currentFilter = btn.dataset.filter;
                document.querySelectorAll('.chip')
                    .forEach(b => b.classList.toggle('active', b === btn));
                applyFilter();
            });
        });
        sortEl.addEventListener('change', () => sortList(sortEl.value));

        // ============================================================
        // 7. SSE
        // ============================================================
        const es = new EventSource('/api/zhk/stream');
        let total = 0;

        es.addEventListener('meta', e => {
            const data = JSON.parse(e.data);
            total = data.total;
            cntTotalEl.textContent = total;
            updateProgress(0, total, `Найдено ${total} объектов. Начинаем обработку…`);
            hideLoader();
        });

        es.addEventListener('progress', e => {
            const data = JSON.parse(e.data);
            const stage = data.stage === 'bin' ? 'Определяем БИН: ' : 'Геокодируем: ';
            updateProgress(data.index, data.total, `${stage}${data.address}…`);
        });

        es.addEventListener('zhk', e => {
            const zhk = JSON.parse(e.data);
            zhkList.push(zhk);
            addZhkToUI(zhk);
            updateProgress(zhkList.length, total, null);
        });

        es.addEventListener('skip', e => {
            const data = JSON.parse(e.data);
            updateProgress(data.index, data.total, null);
        });

        es.addEventListener('done', e => {
            es.close();
            // Схлопываем объекты по адресу: пока стриминг шёл, маркеры
            // были по одному на объект, и одинаковые адреса накладывались
            buildGroups();
            applyFilter();
            console.log('SSE завершён:', e.data,
                        'групп по адресу:', groupsByKey.size);
            // Подтягиваем даты начала строительства отдельным запросом
            loadLicenses();
        });

        es.addEventListener('error', e => {
            if (e.data) {
                try {
                    const data = JSON.parse(e.data);
                    failLoader(data.message || 'Ошибка сервера');
                } catch { failLoader('Ошибка сервера'); }
            } else {
                failLoader('Соединение с сервером потеряно');
            }
            es.close();
        });

        map.on('click', e => console.log('Клик:', e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6)));
    </script>
</body>
</html>
